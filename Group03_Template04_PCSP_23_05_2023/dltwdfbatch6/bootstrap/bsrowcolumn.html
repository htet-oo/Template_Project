<!DOCTYPE html>
<html>
<head>
	<title>Row and Column</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
</head>
<body>
	<div class="container-fluid">
		<h1>Row and Column</h1>

		<div class="row">
			<h1 class="col-6 bg-primary text-light">Hello Yangon</h1>
			<h1 class="col-6 bg-secondary text-light">Hello Mandalay</h1>
			<h1 class="col-4 bg-success text-light">Hello Bago</h1>
			<h1 class="col-3 bg-info text-light">Hello Mawlamyin</h1>
			<h1 class="col-5 bg-danger text-light">Hello Chin</h1>
		</div>
	</div>

	<hr/>

	<div class="container-fluid">
		<div>
			<div class="row">
				<div class="col-6 bg-primary text-light div1">
					<div class="row">
						<div class="col-xxl-3 col-xl-4 col-lg-6 col-md-6 col-sm-12">Column1- div1</div>
						<div class="col-xxl-3 col-xl-4 col-lg-6 col-md-6 col-sm-12">Column2- div1</div>
						<div class="col-xxl-3 col-xl-4 col-lg-6 col-md-6 col-sm-12">Column3- div1</div>
						<div class="col-xxl-3 col-xl-4 col-lg-6 col-md-6 col-sm-12">Column4- div1</div>
						<div class="col-xxl-3 col-xl-4 col-lg-6 col-md-6 col-sm-12">Column5- div1</div>

					</div>
				</div>

				<div class="col-6 bg-danger text-light div2">
					<div class="row">
						<div class="col-xxl-3 col-xl-4 col-lg-6 col-md-6 col-sm-12">
							<div class="row">
								<div class="col-xxl-3 col-xl-4 col-lg-6 col-md-6 col-sm-12">Column2, part1 child1</div>
								<div class="col-xxl-3 col-xl-4 col-lg-6 col-md-6 col-sm-12">Column2, part1 child2</div>
							</div>
						</div>

						<div class="col-xxl-3 col-xl-4 col-lg-6 col-md-6 col-sm-12">
							column2, part2
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.5/dist/umd/popper.min.js" integrity="sha384-Xe+8cL9oJa6tN/veChSP7q+mnSPaj5Bcu9mPX5F5xIGE0DVittaqT5lorf0EI7Vk" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.min.js" integrity="sha384-kjU+l4N0Yf4ZOJErLsIcvOU2qSb74wXpOhqTvwVx3OElZRweTnQ6d31fXEoRD1Jy" crossorigin="anonymous"></script>
</body>
</html>
