<!DOCTYPE html>
<html>
    <head>
        <title>Exercise</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
        <style type="text/css">
        </style>
    </head>
    <body>
        <div class="container">
            <form action="" method="">
                <div class="row">
                    <div class="col-md-6 form-group mb-3">
                        <label for="firstname">FirstName</label>
                        <input type="text" id="firstname" class="form-control rounded-0">
                    </div>
    
                    <div class="col-md-6 form-group mb-3">
                        <label for="lastname">LastName</label>
                        <input type="text" id="lastname" class="form-control rounded-0">
                    </div>

                    <div class="col-md-6 form-group mb-3">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="form-control rounded-0">
                    </div>

                    <div class="col-md-6 form-group mb-3">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control rounded-0">
                    </div>

                    <div class="col-md-6 form-group mb-3">
                        <label for="country">Country</label>
                        <select name="country" id="country" class="form-select">
                            <option selected disabled>Chose Country</option>
                            <option value="mm">Myanmar</option>
                            <option value="th">Thiland</option>
                            <option value="slk">Srilanka</option>
                            <option value="indo">Indonesia</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
    </body>
</html>
