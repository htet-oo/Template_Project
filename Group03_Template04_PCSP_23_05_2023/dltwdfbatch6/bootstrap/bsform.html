<!DOCTYPE html>
<html>
<head>
	<title>Form</title>

	<!-- bootstrap  css1 js2 -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">

	<!-- select 2 css1 and js1 -->
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

	<!-- flatpicker cs1 and js1 -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

	<!-- summer note cs1 and js1 -->
	<link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.css" rel="stylesheet">
</head>
<body>
	<div class="container">
		<h1>Boostrap Form</h1>

		<form action="" method="" enctype="multipart/form-data">
			<div class="row">
				<div class="col-md-6 form-group mb-3">
					<label>First Name</label>
					<input type="text" name="firstname" class="form-control rounded-0" placeholder="Enter your first name"/>
				</div>

				<div class="col-md-6 form-group mb-3">
					<label>Last Name</label>
					<input type="text" name="lastname" class="form-control form-control-sm rounded-0" placeholder="Enter your last name"/>
				</div>

				<div class="col-md-6 form-group mb-3">
					<label form="email">Email</label>
					<input type="email" name="email" id="email" class="form-control" placeholder="Enter email"/>
				</div>

				<div class="col-md-6 form-group mb-3">
					<label form="password">password</label>
					<input type="password" name="password" id="password" class="form-control" placeholder="Enter password"/>
				</div>

				<div class="col-md-6 form-group mb-3">
					<label form="country">Country</label>
					<select name="country" id="country" class="form-select form-select-sm"> 
						<option selected disabled>Chose Country</option>
						<option value="mm">Myanmar</option>
						<option value="th">Thiland</option>
						<option value="slk">Srilanka</option>
						<option value="indo">Indonesia</option>
					</select>
					
				</div>

				<div class="col-md-6 form-group mb-3">
					<label form="role">Role</label>
					<select name="role" id="role" class="form-select form-select-sm multiselect" multiple> 
						<option value="ad">Admin</option>
						<option value="mg">Manager</option>
						<option value="sp">Supervisor</option>
						<option value="ed">Editor</option>
						<option value="vr">Viewer</option>
					</select>
				</div>

				<div class="col-md-6 form-group mb-3 ">
					<div class="form-check">
						<input type="radio" name="gender" id="genderm" class="form-check-input" value="1" /><label for="genderm"> Male</label>
					</div>
					<div class="form-check">
						<input type="radio" name="gender" id="genderf" class="form-check-input" value="0" /><label for="genderf"> Female</label>
					</div>
				</div>

				<div class="col-md-6 form-group mb-3">
					<label >Music</label>
					<div class="form-check">
						<input type="checkbox" name="favmusic" id="favpop" class="form-check-input" value="pop"/><label for="favpop">Pop</label>
					</div>
					<div class="form-check">
						<input type="checkbox" name="favmusic" id="favhip" class="form-check-input" value="hip"/><label for="favhip">Hip</label>
					</div>
					<div class="form-check">
						<input type="checkbox" name="favmusic" id="favrock" class="form-check-input" value="rock"/><label for="favrock">Rock</label>
					</div>
				</div>

				<div class="col-md-6 form-group mb-3">
					<label for="dob">Date of birth</label>
					<input type="date" name="dob" id="dob" class="form-control form-control-sm rounded-0" placeholder="Enter your date of bith">
				</div>


				<div class="col-md-6 form-group mb-3">
					<label for="nrc">NRC</label>
					<input type="file" name="nrc" id="nrc" class="form-control form-control-sm rounded-0">
				</div>

				<div class="col-md-6 form-group mb-3">
					<label for="score">Score</label>
					<input type="range" name="score" id="score" class="form-range form-range-sm rounded-0" min="0" max="100" step="10" />
				</div>

				<div class="col-md-12 form-group mb-3">
					<label for="bio">Summary bio</label>
					<textarea name="bio" id="bio" class="form-control form-control-sm rounded-0"></textarea>
				</div>

				<div class="col-md-12 form-group mb-3">
					<div class="form-check form-switch">
						<input type="checkbox" name="agree" id="agree" class="form-check-input"/>
						<label for="agree">I agree with all the above codations.</label>
					</div>
				</div>

				<div class="col-md-12 bg-info">
					<div class="d-flex justify-content-end">
						<button class="btn btn-secondary btn-sm rounded-0 me-3">cancel</button>
						<button type="Submit"class="btn btn-primary btn-sm rounded-0">Submit</button>
					</div>
				</div>
			</div>
		</form>
	</div>

	<!-- bootstrap js -->
	<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.5/dist/umd/popper.min.js" integrity="sha384-Xe+8cL9oJa6tN/veChSP7q+mnSPaj5Bcu9mPX5F5xIGE0DVittaqT5lorf0EI7Vk" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.min.js" integrity="sha384-kjU+l4N0Yf4ZOJErLsIcvOU2qSb74wXpOhqTvwVx3OElZRweTnQ6d31fXEoRD1Jy" crossorigin="anonymous"></script>

	<!-- jQuery js1 -->
	<script type="text/javascript" src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

	<!-- jQuery select js -->
	<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

	<!-- jQuery flatpicker js-->
	<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

	<!-- summbernote jQuery -->
	<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.js"></script>

	<script type="text/javascript">
		$(document).ready(function(){
			//for role
			$('.multiselect').select2();

			//for dob
			$("#dob").flatpickr({
				enableTime: true,
    			dateFormat: "Y-m-d H:i",
    			// minDate:'2022-5-19',
    			// maxDate:'2022-5-15',
			});

			//for summernote
			$('#bio').summernote({
				placeholder: 'Write Something',
				tabsize: 5,
		        height: 300,
		        toolbar: [
		          ['style', ['style']],
		          ['font', ['bold', 'underline', 'clear']],
		          ['color', ['color']],
		          ['para', ['ul', 'ol', 'paragraph']],
		          ['insert', ['link']],
		          ['view', ['fullscreen']]
		        ]
			});
		});
	</script>
</body>
</html>
