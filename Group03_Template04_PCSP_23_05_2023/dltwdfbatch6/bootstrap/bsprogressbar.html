<!DOCTYPE html>
<html>
<head>
	<title>Progress Bar</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
</head>
<body>
	<div class="container">
		<h1>Progress Bar</h1>

		<div class="progress">
			<div class="progress-bar bg-danger" style="width: 25%;" aria-valuenow='25%' aria-valuemin='0' aria-valuemax='100'></div>
		</div>
		<br/>

		<div class="progress">
			<div class="progress-bar bg-info" style="width:50%;" aria-valuenow='50' aria-valuemin='0' aria-valuemax='100'></div>
		</div>
		<br/>

		<div class="progress">
			<div class="progress-bar bg-success" style="width:100%;" aria-valuenow='100' aria-valuemin='0' aria-valuemax='100'></div>
		</div>

		<hr/>

		<h1>value and striped</h1>
		<div class="progress">
			<div class="progress-bar bg-success" style="width: 75%;" aria-valuenow='75%' aria-valuemin='0' aria-valuemax='100'>75%</div>
		</div>
		<br/><br/>

		<div class="progress">
			<div class="progress-bar progress-bar-striped br-warning" style="width:50%;" aria-valuenow='50' aria-valuemin='0' aria-valuemax='100'>50%</div>
		</div>
		<hr/>

		<h1>Height</h1>
		<div class="progress" style="height:5px">
			<div class="progress-bar" style="width:75%" aria-valuenow='75' aria-valuemin='0' aria-valuemax='100'>75%</div>
		</div>
		<hr/>

		<h1>Multiple Bar</h1>

		<div class="progress">
			<div class="progress-bar bg-danger" style="width:10%;" aria-valuenow='10' aria-valuemin='0' aria-valuemax='100'>10%</div>
			<div class="progress-bar bg-warning" style="width:30%;" aria-valuenow='10' aria-valuemin='0' aria-valuemax='100'>30%</div>
			<div class="progress-bar bg-info" style="width:10%;" aria-valuenow='10' aria-valuemin='0' aria-valuemax='100'>10%</div>
			<div class="progress-bar bg-success" style="width:70%;" aria-valuenow='10' aria-valuemin='0' aria-valuemax='100'>70%</div>
		</div>

	</div>
	<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.5/dist/umd/popper.min.js" integrity="sha384-Xe+8cL9oJa6tN/veChSP7q+mnSPaj5Bcu9mPX5F5xIGE0DVittaqT5lorf0EI7Vk" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.min.js" integrity="sha384-kjU+l4N0Yf4ZOJErLsIcvOU2qSb74wXpOhqTvwVx3OElZRweTnQ6d31fXEoRD1Jy" crossorigin="anonymous"></script>
</body>
</html>
