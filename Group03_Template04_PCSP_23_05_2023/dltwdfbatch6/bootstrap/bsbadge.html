<!DOCTYPE html>
<!DOCTYPE html>
<html>
<head>
	<title>Badge</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
</head>
<body>
	<div class="container">
		<h1>Badge</h1>
		<span class="badge bg-primary">Primary</span>
		<span class="badge bg-secondary">Secondary</span>
		<span class="badge bg-success">Success</span>
		<span class="badge bg-info">Info</span>
		<span class="badge bg-warning">Warnning</span>
		<span class="badge bg-danger">Danger</span>
		<span class="badge bg-light">Light</span>
		<span class="badge bg-dark">Dark</span>
		<hr/>

		<h1>Rounded</h1>
		<span class="badge bg-primary rounded-0">Primary</span>
		<span class="badge bg-secondary rounded">Secondary</span>
		<span class="badge bg-success rounded-pill">Success</span>
		<span class="badge bg-info rounded-0">Info</span>
		<span class="badge bg-warning rounded-0">Warnning</span>
		<span class="badge bg-danger rounded-0">Danger</span>
		<span class="badge bg-light rounded-0">Light</span>
		<span class="badge bg-dark rounded-0">Dark</span>

		<span class="btn btn-info rounded-0">Submit</span>
		<hr/>


		<h4>Hot Sale<span class="badge bg-info">New Item</span></h4>
		<button class="btn btn-success">Notification<span class="badge bg-info">5</span></button>
		<hr/> 
<!-- 
		sup=superscript
		sub=subscript -->
		<b>Add Card<sup class="badge bg-success">9</sup></b>
		<br/><br/>

		<b>Special Discount<sub class="badge bg-info">5%</sub></b>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.5/dist/umd/popper.min.js" integrity="sha384-Xe+8cL9oJa6tN/veChSP7q+mnSPaj5Bcu9mPX5F5xIGE0DVittaqT5lorf0EI7Vk" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.min.js" integrity="sha384-kjU+l4N0Yf4ZOJErLsIcvOU2qSb74wXpOhqTvwVx3OElZRweTnQ6d31fXEoRD1Jy" crossorigin="anonymous"></script>

</body>
</html>
