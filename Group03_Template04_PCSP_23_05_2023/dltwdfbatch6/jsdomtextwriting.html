<!DOCTYPE html>
<html>

	<title>JS Auto Text Writing</title>

<body>
	<div>
        <p id="display"></p>

    <script type="text/javascript">
    	let getdisplay=document.getElementById('display');
        const paragraph = `Lorem ipsum dolor sit amet consectetur adipisicing elit. Odit cum sequi distinctio labore? Minima tenetur asperiores magni id recusandae unde, temporibus nulla blanditiis, dicta aperiam sapiente dignissimos quaerat sequi qui.`;
        let i = 0;
        let j=paragraph.length;
        console.log(i,j);

        // function startwriting(){
        // 	// console.log('hey');
        // 	getdisplay.textContent+=paragraph[i];
        // 	i++;
        // 	if(i===j){
        // 		clearInterval(stopwriting);
        // 	}
        // }
        // let stopwriting = setInterval(startwriting, 20);

        function startwriting(){
            getdisplay.innerText += paragraph[i];
            i++;

            stopwriting(i,j);
        }

        function stopwriting(start,end){
            if(start === end){
                clearInterval(stoptext);
            }
        }

        let stoptext = setInterval(startwriting, 5);

    </script>
</body>
</html>
