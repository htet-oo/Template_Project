<!DOCTYPE html>
<html>
<head>
	<title>Array Method(Default Functions)</title>
</head>
<body>
	<script type="text/javascript">
		//Array methods
		let arrcolors=["red","black","orange","tomato","violet"];
		console.log(arrcolors);
		console.log(arrcolors.length);
		console.log(typeof arrcolors.lenght);

		console.log(arrcolors[3]);
		console.log(arrcolors.indexOf("violet"));

		//character Array in Js
		let myfriend="aung kyaw kyaw";
		console.log(Array.isArray(arrcolors));// result true
		console.log(Array.isArray(myfriend));//result false

		console.log(arrcolors);
		console.log("Array to string by tostring ="+ arrcolors.toString());
		console.log("Array to String by join ="+ arrcolors.join("*"));

		const n=["red","black","green","silver"];
		console.log(n);
		n[1]='pink';
		n[4]="blue";
		console.log(n);
		console.log(n[4]);

		//add new value to array(addon to the end)
		n.push("gold");
		n.push("orange");
		n.push("violet","white");
		console.log(n);

		//add new value to array(addon to the start)
		n.unshift("tomato");
		n.unshift("skyblue","grey");
		console.log(n);

		//remove value and index(take off from front)
		n.shift();
		n.shift()
		console.log(n);

		//remove value and index(take off from back)
		n.pop();
		n.pop()
		console.log(n);

		//remove only value not index
		delete n[2];
		console.log(n);
		console.log(n.length);
		console.log(n[2]);

		//0 = index number , 5= length
		let q= n.splice(0,5);
		console.log(q);
		console.log(q.length);

		//array combine
		const arr1=["aung aung","maung maung",'kyaw kyaw'];
		const arr2=["su su","nu nu","lu lu"];
		const arr3=[100,200,300,400];
		console.log(arr1.concat(arr2));
		console.log(arr1.concat(arr1));
		console.log(arr2.concat(arr1));
		console.log(arr2.concat(arr3));

		const arr4=arr1.concat(arr2);
		console.log(arr4);
		console.log(arr4[3]);

		//sort a to z
		console.log(arr4.sort());

		// reverse the arry
		console.log(arr4.reverse());

		//sort and reserve can't get the right answer in number
		const arr5=[300,200,100,3400,2444];
		console.log(arr5);


	</script>
</body>
</html>
