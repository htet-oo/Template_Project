<!DOCTYPE html>
<!DOCTYPE html>
<html>
<head>
	<title>Window History</title>
	<style type="text/css">
		body{
			display: flex;
			justify-content: center;
		}
		ul{
			display: flex;
			list-style: none;
			margin: 0;
			padding: 0;
		}
		li{
			width: 200px;
			background-color: green;
			color: #fff;
			text-align: center;
			padding: 20px 0;
			transition: all 0.3s;
		}
		nav{
			margin-bottom: 50px;
		}
		li:hover{
			background-color: orange;
		}
		a{
			text-decoration: none;
		}
		.active{
			background-color: orange;
		}
		.historybar span{
			cursor: pointer;
		}
		div p{
			text-align: center;
		}
	</style>
</head>
<body>
	<div>
		<nav>
			<ul>
				<a href="jswindowhistory.html"><li>Home</li></a>
				<a href="jswindowhistorynew.html"><li>News</li></a>
				<a href="jswindowhistoryebook.html"><li>Ebook</li></a>
				<a href="jswindowhistorymusic.html"><li>Music</li></a>
				<a href="jswindowhistoryvideo.html"><li class="active">Video</li></a>
			</ul>
		</nav>
		<div class="historybar">
			<span onclick="gobackward()">Go Backward</span> / <a href="jswindowhistory.html">Home</a> / <span onclick="goforward()"> Go Forward</span>
		</div>

		<div>
			<p>I am video page</p>
		</div>
	</div>
	<script type="text/javascript">
		function gobackward(){
			console.log("back");
			window.history.go(-1);
		}
		function goforward(){
			console.log("front");
			window.history.go(1);
		}
	</script>
</body>
</html>
