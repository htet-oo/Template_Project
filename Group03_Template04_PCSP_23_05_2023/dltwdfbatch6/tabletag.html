<html>
<head>
	<title>Table Tag</title>
</head>
<body>
	<table border="1" bgcolor="silver" width="60%" height="500px">
		<thead>
		<th colspan="6">ABC Co.,Ltd</th>
		<tr>
			<th>No</th>
			<th>Item</th>
			<th>Qty</th>
			<th>Unit</th>
			<th>Total</th>
			<th>QC</th>
		</tr>
		</thead>
		<tbody>
		<tr bgcolor="red">
			<td>1</td>
			<td>Coffee</td>
			<td>1</td>
			<td>pcs</td>
			<td>100</td>
			<td rowspan="3">Passed</td>
		</tr>
		<tr>
			<td>2</td>
			<td>Rice</td>
			<td>1</td>
			<td></td>
			<td>3000</td>
		</tr>
		<tr>
			<td>3</td>
			<td>Water</td>
			<td>2</td>
			<td>bot</td>
			<td>1000</td>
		</tr>
		</tbody>
		<tfoot>
		<tr align="right">
			<td colspan="3">Total</td>
			<td colspan="3">4100</td>
		</tr>
		</tfoot>
	</table>
	<br/>
	<!-- bgcolor is for color -->
	<table border="1" bgcolor="pink" align="center">
		<thead>
			<tr>
				<th>No.</th>
				<th>Item</th>
				<th>Qty</th>
				<th>Unit</th>
				<th>Total</th>
			</tr>
		</thead>
		<tbody>
		</tbody>
		<tfoot>
			<tr>
				<td></td>
				<td></td>
				<td></td>
				<td>Total</td>
				<td></td>
			</tr>
		</tfoot>
	</table>
</body>
</html>
