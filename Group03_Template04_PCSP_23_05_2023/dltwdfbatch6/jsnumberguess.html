<!DOCTYPE html>
<!DOCTYPE html>
<html>
<head>
	<title>JS number guess</title>
	<style type="text/css">
		body{
            height: 100vh;
            background: #f4f4f4;

            display: flex;
            justify-content: center;
            align-items: center;
            
            margin: 0;
            overflow: hidden;
        }

        .form-control{
            padding: 10px;
        }

        .btn{
            padding: 10px
        }

        .message1,.message2{
            display: block;
            margin-top: 12px;
        }
	</style>
</head>
<body>
	<div>
		<h1>Number Guess project</h1>
		<p>Guess a number <span class="mininumber">0</span> to <span class="mixinumber">10</span></p>

		<div class="game">
			<input type="number" name="guessnumber" id="guessnumber" class="form-control" placeholder="Entre the guess number...."/>

			<input type="submit" id="btn" class="btn"/>
			<span class="message1"></span>
            <span class="message2"></span>
		</div>
	</div>
    <script type="text/javascript" src="js/jsguessnumber.js"></script>
</body>
</html>
