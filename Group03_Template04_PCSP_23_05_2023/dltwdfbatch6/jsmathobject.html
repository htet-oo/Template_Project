<!DOCTYPE html>
<html>
<head>
	<title>Math Object</title>
</head>
<body>
	<script type="text/javascript">
		let val;
		//exact value
		val=2.8; //result 2.8
		val=2.4; //result 2.4

		// adding 1 after 5
		val=Math.round(2.8);
		val=Math.round(2.4); 

		//adding 1 after 1
		val=Math.ceil(2.8);//result 3
		val=Math.ceil(2.5);//result 3
		val=Math.ceil(2.4);//result 3

		//adding 0 whatever
		val=Math.floor(2.4);//result 2
		val=Math.floor(2.8);//result 2

		val=Math.sqrt(49);//result 7,  square root
		val=Math.pow(8,2);//result 64, 8*8

		val=Math.abs(100);//result 100 /absolute
		val=Math.abs(-100);//result 100 /absolute

		val=Math.min(0,2,3,1,5,7);//parameter's smallest number
		val=Math.max(0,2,3,1,5,7);//parameter's maximum number

		val=Math.random();
		console.log(val);
		val=Math.floor(Math.random()*10000);
		console.log(val);
	</script>
</body>
</html>
