<!DOCTYPE html>
<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Set Timeout</title>
</head>
<body>
	<div>
		<h1 id="greeting">Welcome to our site</h1>
	</div>

	<hr/>
	<div>
		<button type='button' id="startalert" class="" onclick="startbtn()">Start Alert</button>
		<button type="button" id="stopalert" class="" onclick="stopbtn()">Stop Alert</button>
	</div>

	<hr/>

	<div>
		<form action="" method="">
			<input type="text" name="url" id="url" placeholder="enter url" class=""/>
			<input type="button" id="urlbtn" class="" value="Go URL" onclick="gourl()"/>
			<input type="button" id="favbtn" class="" value="Fav URL" onclick="favurl('https://linkin.com')"/>
		</form>
	</div>
	<hr/>

	<div>
		<img id="img1" class="" width="200px" height="200px" onmouseover="imgover()" onmouseout="imgout()" />
	</div>

	<hr/>

	<div>
		<img src="img/icon/icon4.png" id="myimg" class="" alt="myimg" width="100px" />
		<select name="size" id="size" class="" onchange="imagesize(this)">
			<option selected disabled>Select</option>
			<option value="50">Small</option>
			<option value="250">Medium</option>
			<option value="350">Large</option>
		</select>
	</div>

	<script type="text/javascript">
		//For Greeting

		// window.setInterval(newmessage,2000);
		window.setTimeout(newmessage,3000);
		function newmessage(){
			document.getElementById('greeting').textContent='See you later';
		}

		//For Alert

		// function mypopup(){
		// 	window.alert('Welcome Sir.....');
		// }
		// let mytimer;
		// function startbtn(){
		// 	// console.log('start');
		// 	mypopup();
		// 	mytimer=window.setTimeout(startbtn,3000);
		// 	// window.setInterval(startbtn(),3000);
		// }
		// function stopbtn(){
		// 	//console.log('i am stop');
		// 	window.clearInterval(mytimer);
		// }

		//For URL

		function gourl(){
			//console.log('hey');
			const geturl=document.getElementById('url').value;
			console.log(geturl);

			window.location="https://"+geturl;
		}

		function favurl(linkin){
			window.location=linkin;
		}

		//Mouse Event

		let getimg1=document.getElementById('img1');
		window.onload=function(){
			getimg1.src='img/icon/icon1.png';
		}

		function imgover(){
			console.log('hehe');
			getimg1.src='img/icon/icon2.png';
		}
		function imgout(){
			getimg1.src='img/icon/icon3.png';
		}

		//For image Size

		function imagesize(th){
			// console.log('hehe');
			let getsize=th.value;
			let getmyimg=document.getElementById('myimg');
			getmyimg.width=getsize;
		}
	</script>
</body>
</html>
