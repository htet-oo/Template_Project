<!DOCTYPE html>
<html>
<head>
	<title>Document Object</title>
	<!-- fontawesome css1 -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	<link rel="stylesheet" type="text/css" href="css/jsdocumentobject.css">
</head>
<body>
	<div class="container">
		<div class="card">
			<div class="card-content">
				<h3 class="card-title">Todo List</h3>
				<form id="task-form" class="form" action="" method="">
					<div class="form-control">
						<label for="task">Enter New Task</label>
						<input type="text" name="task" id="task" class="task"/>
					</div>
					<input type="submit" class="btn" value="Add Task"/>
				</form>
			</div>

			<div class="card-action">
				<h4 id="tasktitle">Tasks</span></h4>
				<ul class="list-group">
					<li class="list-group-item">List item 1<a href="#" id="delete-item1" class="delete-item delete-me"><i class="fa-solid fa-trash-can"></i></a></li>
					<li class="list-group-item">List item 2<a href="#" id="delete-item2" class="delete-item"><i class="fa-solid fa-trash-can"></i></a></li>
					<li class="list-group-item">List item 3<a href="#" id="delete-item3" class="delete-item"><i class="fa-solid fa-trash-can"></i></a></li>
					<li class="list-group-item">List item 4<a href="#" id="delete-item4" class="delete-item"><i class="fa-solid fa-trash-can"></i></a></li>
					<li class="list-group-item">List item 5<a href="#" id="delete-item5" class="delete-item"><i class="fa-solid fa-trash-can"></i></a></li>
					
				</ul>
				<a href="https://google.com" class="clear-tasks" id="clear-tasks">Clear tasks</a>
			</div>
			<div class="moretasks">
				<img src="https://i.stack.imgur.com/kOnzy.gif" class="loading" alt="loading" abc="Htet OO Wai Yan">
			</div>
		</div>
	</div>
	<script type="text/javascript" src="js/jsdocumentobject.js">
		
	</script>
</body>
</html>
