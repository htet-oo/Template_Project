<!DOCTYPE html>
<html>
<head>
	<title>JS Datatype</title>
</head>
<body>
	<script type="text/javascript">
		// string data type
		const name='kyaw kyaw';
		console.log(name);
		console.log(typeof name);
		console.log(typeof(name));

		let home = "";
		console.log(home);
		console.log(typeof home);

		//number data type
		const age=25;
		console.log(typeof age);
		console.warn(typeof age);
		console.error(typeof age);

		//boolen data type
		const hascar=false;
		var havecar=true;
		console.log(typeof hascar);
		console.log(typeof havecar);

		//undefined
		var test;
		console.warn(test);
		console.log(typeof test);

		// object datatype 
		let car = null;
		console.log(car);
		console.log(typeof car);

		//Date(object)
		const date=new Date();
		console.log(date);
		console.log(typeof date);

		//Object data type
		const address = {
			no:"No.123",
			street:"st 38St",
			city:"Mandalay"
			zipcode:{
				countrycode:95,
				areacode:11131
			}
		};
		console.log(address);
		console.log(typeof address);

		//Object (Array) data type
		const hobbies=["movie","music","sport"];
		console.log(hobbies);
		console.log(typeof hobbies);

	</script>
</body>
</html>
