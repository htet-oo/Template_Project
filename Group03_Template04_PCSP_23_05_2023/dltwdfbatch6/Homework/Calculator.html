<!DOCTYPE html>
<!DOCTYPE html>
<html>
<head>
	<title>Calculator</title>
	<link rel="stylesheet" type="text/css" href="./Calculator.css">
</head>
<body>
	<div class="calbody">
		<div class="forinput">
			<div style="width: 120px; margin-left: -20px;">
				<h3 id="display">10:42:00 AM</h3>
			</div>
			<div>
				<input type="text" name="getnum" id="getnum" class="getnum" />
			</div>
		</div>

		<br/>

		<div class="fornumber">
			<div class="multinumber">
				<div class="multinumberdiv">
					<button type="button" id="clear" class="clear" onclick="clean('CE')">CE</button>
					<button type="button" id="per" class="per" value=% onclick="getele('%')">%</button>
					<button type="button" id="plus" class="plus" value=+ onclick="getele('+')">+</button>
					<button type="button" id="minus" class="minus" value=- onclick="getele('-')">-</button>
				</div>
			</div><br/>
			<div class="number">
				<div class="numberdiv">
					<button type="button" id="seven" class="seven" value=7 onclick="getele1('7')">7</button>
					<button type="button" id="eight" class="eight" value=8 onclick="getele1('8')">8</button>
					<button type="button" id="nine" class="nine"   value=9 onclick="getele1('9')">9</button>
					<button type="button" id="division" class="division"  value=/ onclick="getele('/')">/</button>
				</div>
			</div><br/>
			<div class="number1">
				<div class="number1div">
					<button type="button" id="four" class="four" value=4 onclick="getele1('4')">4</button>
					<button type="button" id="five" class="five" value=5 onclick="getele1('5')">5</button>
					<button type="button" id="six" class="six"   value=6 onclick="getele1('6')">6</button>
					<button type="button" id="multi" class="multi" value=* onclick="getele('*')">*</button>
				</div>
			</div><br/>

			<div class="number2">
				<div class="number2div">
					<button type="button" id="one" class="one" value=1 onclick="getele1('1')">1</button>
					<button type="button" id="two" class="two" value=2 onclick="getele1('2')">2</button>
					<button type="button" id="three" class="three" value=3 onclick="getele1('3')">3</button>

					<br/><br/>

					<button type="button" id="zero" class="zero"  value=0 onclick="getele1('0')">0</button>
					<button type="button" id="dot" class="dot"  value=. onclick="getele1('.')">.</button>
				</div>
				<div class="number2secdiv">
					<button type="button" id="equal" class="equal" value== onclick="calculate()">=</button>
				</div>
			</div>
		</div>
		<input type="hidden" name="tempsign" id="tempsign" class="" placeholder="0" />
		<input type="hidden" name="tempsign1" id="tempsign1" class="" placeholder="1" />
		<input type="hidden" name="tempsign2" id="tempsign2" class="" placeholder="2" />
	</div>
	<script type="text/javascript" src="Calculator.js"></script>
</body>
</html>
