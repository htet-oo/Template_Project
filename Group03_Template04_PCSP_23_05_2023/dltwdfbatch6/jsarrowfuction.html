<!DOCTYPE html>
<html>
<head>
	<title></title>
</head>
<body>
	<script type="text/javascript">
		//Arrow function

		let regparameter=function(){
			return "i love mandalay";
		};
		console.log(regparameter());

		//Method 1
		let arrmanualfun1 =()=>{
			return "Hello";
		}
		console.log(arrmanualfun1());

		//Method 2
		let arrmanualfun2=()=>"Hello Yangon";
		console.log(arrmanualfun2());

		let	arrmanualfun3=()=>({name:"Aung Aung"});
		console.log(arrmanualfun3());

		//Method 3
		let arrmanualfun4=()=>("Hello Mandalay");
		console.log(arrmanualfun4());

		let	arrmanualfun5=()=>({name:"Aung Aung"});
		console.log(arrmanualfun5());

		//ii.parameter Function

			//reg function

			let regsinglefun=function(num1){
				return num1+10;
			}
			console.log("This is reg function with singleparameter"+regsinglefun(20));

			let regmultifun=function(num1,num2){
				return num1+num2;
			}
			console.log("This is reg function with multiparameter"+regmultifun(20,30));	

			//arr function
				//single parameter

				let arrsinglefun1=(num1)=>{
					return num1+10;
				}	
				console.log("This is arr function with single prarmeter"+arrsinglefun1(10));

				let arrsinglefun2=num1=>{
					return num1+10;
				}
				console.log("This is arr function with single prarmeter"+arrsinglefun2(10));

				let arrsinglefun3=num1=>num1+10;
				console.log("This is arr function with single prarmeter"+arrsinglefun3(10));


				//arr multi parameter
				let arrmultifun1=(num1,num2)=>{
					return num1+num2;
				}
				console.log("This is the arr function with multi parameter "+arrmultifun1(10,20));

				let arrmultifun2=(num1=40,num2=30)=>{
					return num1+num2;
				}
				console.log("This is the arr function with multi parameter "+arrmultifun2(20));
	</script>
</body>
</html>
