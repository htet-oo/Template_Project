<!DOCTYPE html>
<html>
<head>
	<title>Document Object</title>
	<!-- fontawesome css1 -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	<!-- for bootstrap css -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
	<style type="text/css">
    body{
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: silver;
    }
    .box{
      width: 500px;
      height: 500px;
      border: 1px solid black;
      box-shadow: 2px 2px 1px black;
    }
    .form-control{
      width: 467px;
      height: 70px;
      margin: auto;
    }
    .numbers{
      width: 75%;
      height: 100%;
    }
    .subnumbers{
      margin-left: 11px;
    }
    .numbers .subnumbers div,.operators div{
      width: 100px;
      height: 40px;
    }
    .results{
      width: 25%;
      height: 100%;
    }
    .results div{
      width: 100px;
      height: 208px;
      text-align: center;
      line-height: 208px;
    }
  </style>
  <body>
    <div class="box">
      <div class="input form-group mt-5">
        <input type="text" id="inputbox" class="form-control">
      </div>
      <div class="operators text-center mt-4">
        <div class="btn btn-light rounded-0 m-2">+</div>
        <div class="btn btn-light rounded-0 m-2">-</div>
        <div class="btn btn-light rounded-0 m-2">*</div>
        <div class="btn btn-light rounded-0 m-2">/</div>
      </div>
      <div class="d-flex mt-4">
        <div class="numbers">
          <div class="subnumbers">
            <div class="btn btn-light rounded-0 m-2">7</div>
            <div class="btn btn-light rounded-0 m-2">8</div>
            <div class="btn btn-light rounded-0 m-2">9</div>
            <div class="btn btn-light rounded-0 m-2">4</div>
            <div class="btn btn-light rounded-0 m-2">5</div>
            <div class="btn btn-light rounded-0 m-2">6</div>
            <div class="btn btn-light rounded-0 m-2">1</div>
            <div class="btn btn-light rounded-0 m-2">2</div>
            <div class="btn btn-light rounded-0 m-2">3</div>
            <div class="btn btn-light rounded-0 m-2">0</div>
            <div class="btn btn-light rounded-0 m-2">.</div>
            <div class="btn btn-light rounded-0 m-2" id="clear">C</div>
          </div>
        </div>
        <div class="results">
          <div class="btn btn-primary rounded-0 m-2" id="resultbtn">=</div>
        </div>
      </div>
    </div>
    <!-- for bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous"></script>
    <script type="text/javascript" src="./practice.js"></script>
  </body>
</body>
</html>
