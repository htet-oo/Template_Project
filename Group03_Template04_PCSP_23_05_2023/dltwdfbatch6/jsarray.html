<!DOCTYPE html>
<html>
<head>
	<title>JS Array</title>
</head>
<body>
	<script type="text/javascript">
		let person = {
			person1:"aung aung",
			person2:"kyaw kyaw",
			person3:"zaw zaw"
		};
		console.log(person);
		console.table(person);
		//Manual array (array start from index number[0])
		let arrgirls = new Array("su su","lu lu","hla hla");
		console.log(arrgirls);
		console.log(arrgirls.length);

		console.log(arrgirls[1]);
		console.log(arrgirls[2]);
		console.log(arrgirls[3]);//undefined

		let arrboys = ["mg mg","aung aung","kaung kaung","myint myint"];
		console.log(arrboys);
		console.log(arrboys.length);
		console.log(arrboys[1]);
		console.log(arrboys[3]);

		console.table(arrboys);

		let x=[1000,1200,1300,1400,1500,1600];
		console.log(x);

		let y =["hello",1500,true,null,undefined,new Date(),{firstname:"kyaw kyaw",lastname:"aung aung"}];
		console.log(y);
		console.table(y);
		console.log(y[6].firstname);
		console.log(y[6].lastname);

		console.log(x.indexOf(1000));
		console.log(x.indexOf(1300));
		console.log(x.indexOf(900));//if th value doesn't exist -1

		//string is character array in js
		let myfriend = "Aung Ko Ko";
		console.log(myfriend);
		console.log(typeof myfriend);
		console.log(myfriend.length);
		console.log(myfriend[0]);
		console.log(myfriend[5]);

		let m=[];
		console.log(m);
		console.log(typeof m);

		m[3] = "orange";
		m[0] = "red";
		m[1] = "green";
		m[2] = "black";
		m[4] = "violet";
		m[7] = "blue";

		console.log(m);
		console.table(m.length);
		console.log(m[1]);
		console.log(m[4]);
		console.log(m[5]);//result = undefined
		console.log(m[6]);//result =undefined
	</script>
</body>
</html>
